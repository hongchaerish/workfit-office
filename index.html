<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorkFit Intranet</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">

    <!-- PWA (모바일 메신저 /m — 홈 화면에 추가 시 앱처럼 실행) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101830" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="워크핏" />
    <script>
      // 모바일 PWA(/m) 전용 초기화(데스크톱/일반 라우트엔 영향 없음).
      if (location.pathname.indexOf('/m') === 0) {
        // 1) 데스크톱 확대(body zoom, 기본 1.48) 없이 1배율로 시작.
        //    초기 렌더에서 아이폰 화면보다 크게 그려졌다가 줄어드는 깜빡임 방지(App.tsx 와 동일 정책).
        document.documentElement.style.setProperty('--font-scale', '1');
        // 2) 두 손가락 핀치 줌 비활성화 → 네이티브 앱 느낌.
        //    iOS 는 홈 화면에 설치된 standalone PWA 에서 user-scalable=no 를 존중한다.
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp) {
          vp.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no'
          );
        }
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
